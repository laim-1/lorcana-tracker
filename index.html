<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241d4a"><title>Liam's Lorcana Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css"></head><body>
<header id="top">
 <div class="row"><button id="back" class="icon-btn" aria-label="Back to sets" hidden>Back</button>

 <div class="row"><input type="search" id="q" placeholder="Search sets" enterkeyhint="search" autocomplete="off">

 <div id="sub" class="sub"></div>

<div id="scrim" hidden></div>

 <div class="grab"></div><div id="sheet-body"></div>
</section>
<input type="file" id="import" accept=".json,application/json" hidden>
<script src="./data/snapshot.js"></script><script src="./js/app.js"></script></body></html>
